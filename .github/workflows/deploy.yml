name: Build graph and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"   # every Monday, 08:00 IST: rebuild from fresh OpenStreetMap data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download Delhi OSM extract
        run: python pipeline/fetch.py
      - name: Build safety-weighted walking graph
        run: python pipeline/build_graph.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
